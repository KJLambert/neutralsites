# Config file for Python.
[project]
name = "neutralsites"
version = "0.1.0"
description = "This project is meant to capture all local dependencies, which will be managed by uv"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "biopython>=1.83",
    "black>=24.8.0",
    "click>=8.1.8",
    "pathlib>=1.0.1",
    "scikit-bio>=0.5.8",  # For sequence analysis and clustering
    "numpy>=1.24.0",      # Required by scikit-bio
    "scipy>=1.10.0",      # Required for clustering
]

# Should be kept the same as nf-core/tools to avoid fighting with template synchronisation.
[tool.black]
line-length = 120
target_version = ["py37", "py38", "py39", "py310"]

[tool.isort]
profile = "black"
known_first_party = ["nf_core"]
multi_line_output = 3
